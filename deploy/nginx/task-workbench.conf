# Replace workbench.example.invalid and certificate paths before nginx -t.
# Included within http {}; default servers reject unexpected Host values.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name workbench.example.invalid;
    return 308 https://workbench.example.invalid$request_uri;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name workbench.example.invalid;
    ssl_certificate /etc/ssl/task-workbench/fullchain.pem;
    ssl_certificate_key /etc/ssl/task-workbench/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    root /opt/task-workbench/current/frontend;
    index index.html;
    client_max_body_size 11m;
    client_body_timeout 30s;
    send_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Enable after valid TLS is verified for all clients; no preload by default.
    # add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /actuator { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host workbench.example.invalid;
        proxy_set_header X-Forwarded-Host workbench.example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
