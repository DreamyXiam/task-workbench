name: Verify source and security gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: mvn -B -ntp -f backend/pom.xml org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=7 -Dformat=ALL -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - run: mvn -B -ntp -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-and-tests
          path: |
            backend/target/surefire-reports
            backend/target/dependency-check-report.*
            backend/target/bom.*
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/sbom.cdx.json
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets (redacted)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --exit-code=1
      - name: SAST (registry rules need network)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.139.0 semgrep scan --config p/owasp-top-ten --error /src/backend /src/frontend
      - name: Dependency and configuration vulnerability gate
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.67.2 fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: Operational template consistency
        run: python3 scripts/check-operations.py
      - name: Shell syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
