name: Verify source and security gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: mvn -B -ntp -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=true
      - name: Unfiltered backend advisory evidence
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 sbom --severity HIGH,CRITICAL --format json --output /repo/backend/target/trivy-sbom-unfiltered.json /repo/backend/target/bom.json
      - name: Resolved backend dependency vulnerability gate
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 sbom --vex /repo/docs/security/spring-mvc.openvex.json --severity HIGH,CRITICAL --exit-code 1 --format json --output /repo/backend/target/trivy-sbom.json /repo/backend/target/bom.json
      - name: Packaged backend vulnerability gate
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 fs --vex /repo/docs/security/spring-mvc.openvex.json --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /repo/backend/target/trivy-jar.json /repo/backend/target/task-workbench-1.5.0-SNAPSHOT.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-security-and-tests
          retention-days: 14
          path: |
            backend/target/surefire-reports
            backend/target/trivy-sbom.json
            backend/target/trivy-sbom-unfiltered.json
            backend/target/trivy-jar.json
            backend/target/bom.*
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sbom
          retention-days: 14
          path: frontend/sbom.cdx.json
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secrets (redacted)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect --source=/repo --redact --exit-code=1 --log-opts=--all
      - name: SAST (registry rules need network)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.139.0@sha256:e1e0cde346c758f755e1bd28fd0ea43cde9d523b59a040611a6bdde2f84bb3dd semgrep scan --config p/owasp-top-ten --error /src/backend /src/frontend
      - name: Dependency and configuration vulnerability gate
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 fs --scanners vuln,misconfig --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: Operational template consistency
        run: python3 scripts/check-operations.py
      - name: Shell syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
